<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%">
  <defs>
    <style>
      .upb-text { font-family: 'Outfit', 'Inter', sans-serif; font-weight: 900; fill: #ffffff; letter-spacing: 2px; }
      .forum-text { font-family: 'Space Grotesk', 'Outfit', sans-serif; font-weight: 700; fill: #ffffff; letter-spacing: 3px; }
      .sub-text { font-family: 'Inter', sans-serif; font-weight: 400; fill: #08a9dd; letter-spacing: 1.5px; font-size: 15px; }
      .divider-line { stroke: #08a9dd; stroke-width: 2.5; stroke-linecap: round; }
    </style>
  </defs>
  <!-- UPB Symbol Box -->
  <g transform="translate(10, 20)">
    <rect x="0" y="0" width="130" height="75" rx="6" fill="#0c1626" stroke="#08a9dd" stroke-width="1.5" />
    <text x="65" y="52" text-anchor="middle" class="upb-text" font-size="44">UPB</text>
  </g>
  <!-- Vertical Divider -->
  <line x1="160" y1="20" x2="160" y2="95" class="divider-line" />
  <!-- FÓRUM Centro de Eventos -->
  <g transform="translate(180, 20)">
    <text x="0" y="42" class="forum-text" font-size="34">FÓRUM</text>
    <text x="0" y="68" class="sub-text">Centro de Eventos</text>
  </g>
</svg>
